<div class="h-screen flex flex-col items-center justify-center p-4">
  <div *ngIf="token" class="w-full max-w-xl mx-auto bg-white p-6 rounded-md shadow-md">
    <h2 class="text-lg font-bold mb-4">Chatroom</h2>
    <div #messagesContainer class="h-60 overflow-y-auto border border-gray-300 p-2 mb-4 rounded">
      <div *ngFor="let msg of messages" class="mb-2">
        <span class="text-blue-500">({{ msg.createdAt | date:'HH:mm:ss' }})</span> -
        <strong>{{ msg.user }}</strong>:
        <span class="whitespace-pre-wrap break-words">{{ msg.text }}</span>
      </div>
    </div>
    <form [formGroup]="messageForm" (ngSubmit)="sendMessage()">
      <input formControlName="message" class="border border-gray-300 p-2 rounded w-full"
             placeholder="Écrire un message"
             maxlength="200" />
      <!-- Character counter that changes color based on length -->
      <div [ngClass]="{'text-red-500': messageForm.get('message')?.value?.length >= 200, 'text-gray-500': messageForm.get('message')?.value?.length < 200}"
           class="text-sm mt-1 text-right">
        {{ messageForm.get('message')?.value?.length || 0 }} / 200
      </div>
      <div *ngIf="messageForm.get('message')?.errors?.['maxlength']" class="text-red-500 text-sm mt-1">
        Le message ne peut pas dépasser 200 caractères
      </div>
      <button type="submit" class="mt-2 w-full bg-blue-500 text-white p-2 rounded disabled:bg-blue-200" [disabled]="!messageForm.valid">Envoyer</button>
    </form>
    <button (click)="logout()" class="mt-2 w-full bg-red-500 text-white p-2 rounded">Déconnexion</button>
  </div>
</div>
