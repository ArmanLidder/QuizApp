<div class="p-6 max-w-md mx-auto bg-white rounded-xl shadow-md space-y-6">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Nom du quiz déjà utilisé</h2>

    <div class="space-y-4">
        <p class="text-gray-700">Le nom de quiz <strong>{{ data.quizName }}</strong> est déjà utilisé.</p>

        <label for="quizName" class="block text-sm font-medium text-gray-700">Veuillez entrer un nouveau nom</label>
        <input
                [(ngModel)]="newQuizName"
                maxlength="100"
                type="text"
                id="quizName"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                placeholder="Entrer un nouveau nom du quiz"
        />
        <p *ngIf="nameError" class="text-red-600 text-sm">{{ nameError }}</p>
    </div>

    <div class="flex flex-col items-center space-y-4">
        <div class="flex justify-end space-x-4 w-full">
            <button (click)="onCloseClick()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                Annuler
            </button>

            <button
                    [disabled]="!newQuizName"
                    (click)="onConfirmClick()"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Confirmer
            </button>
        </div>
    </div>
</div>
