<div class="dialog-container">
    <h2 class="dialog-title">{{ 'GAME_CONFIG_DIALOG.CONFIGURE_GAME' | translate }}</h2>
    <form class="form-container" [formGroup]="gameConfigForm" (ngSubmit)="saveConfig()">
        <div class="field-container">
            <label for="gameType">{{ 'GAME_CONFIG_DIALOG.GAME_TYPE_LABEL' | translate }}</label>
            <select formControlName="gameType" id="gameType" class="select-field">
                <option value="classic">{{ 'GAME_CONFIG_DIALOG.CLASSIC' | translate }}</option>
                <option value="equipe">{{ 'GAME_CONFIG_DIALOG.TEAM' | translate }}</option>
            </select>
            <div class="error-message" *ngIf="gameConfigForm.get('gameType')?.hasError('required')">
                {{ 'GAME_CONFIG_DIALOG.GAME_TYPE_REQUIRED' | translate }}
            </div>
        </div>

        <div class="field-container">
            <label for="price">{{ 'GAME_CONFIG_DIALOG.PRICE_LABEL' | translate }}</label>
            <input id="price" class="number-input" matInput type="number" formControlName="price"/>
            <div class="error-message" *ngIf="gameConfigForm.controls['price'].invalid">
                {{ 'GAME_CONFIG_DIALOG.PRICE_INVALID' | translate }}
            </div>
        </div>

        <div class="checkbox-group">
            <label class="custom-checkbox">
                <input type="checkbox" formControlName="friendsOnly"/>
                <span>{{ 'GAME_CONFIG_DIALOG.FRIENDS_ONLY_LABEL' | translate }}</span>
            </label>

            <label class="custom-checkbox">
                <input type="checkbox" formControlName="private"/>
                <span>{{ 'GAME_CONFIG_DIALOG.PRIVATE_GAME_LABEL' | translate }}</span>
            </label>

            <label class="custom-checkbox">
                <input type="checkbox" formControlName="IA"/>
                <span>{{ 'GAME_CONFIG_DIALOG.IA_CORRECTION' | translate }}</span>
            </label>
        </div>

        <div class="field-container">
            <label for="prestige">{{ 'GAME_CONFIG_DIALOG.MIN_PRESTIGE_LABEL' | translate }}</label>
            <select formControlName="prestige" id="prestige" class="select-field">
                <option value="0">{{ 'GAME_CONFIG_DIALOG.NONE' | translate }}</option>
                <option value="50">{{ 'GAME_CONFIG_DIALOG.BRONZE' | translate }}</option>
                <option value="100">{{ 'GAME_CONFIG_DIALOG.SILVER' | translate }}</option>
                <option value="150">{{ 'GAME_CONFIG_DIALOG.GOLD' | translate }}</option>
                <option value="200">{{ 'GAME_CONFIG_DIALOG.PLATINUM' | translate }}</option>
            </select>
            <div class="error-message" *ngIf="gameConfigForm.get('prestige')?.hasError('required')">
                {{ 'GAME_CONFIG_DIALOG.PRESTIGE_REQUIRED' | translate }}
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-cancel" type="button" (click)="closeDialog()">
                {{ 'GAME_CONFIG_DIALOG.CANCEL_BUTTON' | translate }}
            </button>
            <button class="btn btn-primary" type="submit" [disabled]="!gameConfigForm.valid">
                {{ 'GAME_CONFIG_DIALOG.CREATE_GAME_BUTTON' | translate }}
            </button>
        </div>
    </form>
</div>
