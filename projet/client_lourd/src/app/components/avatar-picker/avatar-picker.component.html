<div class="space-y-6">
    <h2 class="text-xl text-center font-semibold">Choisissez votre avatar</h2>

    <div class="flex flex-wrap justify-center gap-4">
        <div *ngFor="let avatarUrl of defaultAvatars" (click)="selectAvatar(avatarUrl)" class="avatar-item">
            <img [src]="avatarUrl" alt="Avatar" class="w-24 h-24 rounded-full"
                 [class.ring-4]="avatarUrl === selectedAvatar"
                 [class.ring-blue-500]="avatarUrl === selectedAvatar"/>
        </div>
        <div *ngIf="customAvatarUrl" class="avatar-item">
            <img [src]="customAvatarUrl"
                 alt="Custom Avatar" class="w-24 h-24 rounded-full "
                 [class.ring-4]="customAvatarSelected"
                 [class.ring-blue-500]="customAvatarSelected"
                 (click)="selectCustomAvatar()"/>
        </div>
    </div>

    <div class="text-center">
        <label for="custom-avatar" class="block text-center font-medium text-gray-700 mb-3">
            Ou téléchargez votre propre avatar
        </label>
        <div class="space-y-6">
            <label for="custom-avatar" class="cursor-pointer bg-white py-2 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Choisir un fichier
            </label>
            <input id="custom-avatar" type="file" accept="image/*" (change)="onCustomAvatarUploaded($event)" class="hidden"/>
        </div>
    </div>

</div>
