<mat-tab-group class="h-full">
    <mat-tab label="Amis">
        <div class="p-4 h-60 flex flex-col">
            <div *ngIf="(friends$ | async) as friends; else noFriends" class="h-full">
                <ng-container *ngIf="friends.length > 0; else noFriends">
                    <ul class="bg-white shadow-md rounded-lg divide-y divide-gray-200 h-full overflow-y-auto">
                        <li *ngFor="let friend of friends" class="p-4 flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <app-avatar-with-level [user]="friend"></app-avatar-with-level>
                                <span class="font-medium text-gray-700">{{ friend.username }}</span>
                            </div>
                            <button class="text-red-600 hover:text-red-700 transition duration-300 ease-in-out"
                                    (click)="removeConfirmDialog(friend.uid)">
                                <mat-icon>person_remove</mat-icon>
                            </button>
                        </li>
                    </ul>
                </ng-container>
            </div>
            <ng-template #noFriends>
                <div class="flex justify-center items-center h-full">
                    <p class="text-center text-gray-600">Vous n'avez pas encore d'amis.</p>
                </div>
            </ng-template>
        </div>
    </mat-tab>

    <mat-tab label="En Attente">
        <div class="p-4 h-60 flex flex-col">
            <div *ngIf="(pendingRequests$ | async) as requests; else noRequests" class="h-full">
                <ng-container *ngIf="requests.length > 0; else noRequests">
                    <ul class="bg-white shadow-md rounded-lg divide-y divide-gray-200 h-full overflow-y-auto">
                        <li *ngFor="let request of requests" class="p-4 flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <app-avatar-with-level [user]="request"></app-avatar-with-level>
                                <span class="font-medium text-gray-700">{{ request.username }}</span>
                            </div>
                            <div class="flex space-x-2">
                                <button class="text-green-600 hover:text-green-700 transition duration-300 ease-in-out"
                                        (click)="acceptFriendRequest(request.uid)">
                                    <mat-icon>check_circle</mat-icon>
                                </button>
                                <button class="text-red-600 hover:text-red-700 transition duration-300 ease-in-out"
                                        (click)="denyFriendRequest(request.uid)">
                                    <mat-icon>cancel</mat-icon>
                                </button>
                            </div>
                        </li>
                    </ul>
                </ng-container>
            </div>
            <ng-template #noRequests>
                <div class="flex justify-center items-center h-full">
                    <p class="text-center text-gray-600">Pas de demandes d'amis en attente.</p>
                </div>
            </ng-template>
        </div>
    </mat-tab>
</mat-tab-group>
