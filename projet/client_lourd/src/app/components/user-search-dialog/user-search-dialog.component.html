<div class="p-6 max-w-md mx-auto bg-white rounded-xl shadow-md space-y-6">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Recherche d'utilisateurs</h2>

    <mat-form-field class="w-full">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput placeholder="Rechercher un utilisateur" [formControl]="searchControl" />
    </mat-form-field>

    <div class="mt-4 space-y-2 max-h-80 overflow-y-auto">
        <div *ngFor="let user of filteredUsers$ | async" class="bg-gray-100 rounded-lg p-3 flex items-center space-x-3 shadow-sm">
            <app-avatar-with-level [user]="user"></app-avatar-with-level>
            <div class="flex-grow">
                <h3 class="text-base font-medium text-gray-900">{{ user.username }}</h3>
            </div>
            <div class="items-center">
                <ng-container *ngIf="!hasPendingRequest(user, currentUser$ | async); else pendingRequestIcon">
                    <button (click)="sendFriendRequest(user)" class="items-center text-black hover:text-gray-600 font-semibold transition duration-300 ease-in-out flex">
                        <mat-icon class="mr-2" matTooltip="Envoyer une requête d'ami"
                                  matTooltipClass="custom-tooltip">person_add</mat-icon>
                    </button>
                </ng-container>
                <ng-template #pendingRequestIcon>
                    <mat-icon
                            class="mr-2 items-center text-black hover:text-gray-600 font-semibold transition duration-300 ease-in-out flex"
                            matTooltip="Requête en attente"
                            matTooltipClass="custom-tooltip"
                    >hourglass_empty</mat-icon>
                </ng-template>
            </div>
        </div>
    </div>
</div>
