<div *ngIf='!waitingRoomManagementService.isTransition' class="waiting-room">
    <div class="waiting-room-header">
        <h1>Salle d'attente</h1>
        <h2 *ngIf='isHost'>Code : {{ waitingRoomManagementService.roomId }}</h2>
        <div *ngIf='isHost'>
            <h3> La salle est {{ setLockActionMessage() }}</h3>
            <label class="switch-btn" matTooltip="Verrouiller la salle">
                <input type="checkbox" (click)='toggleRoomLocked()'/>
                <span class="slider round"></span>
            </label>
        </div>
    </div>

    <div class="players-list">
        <ng-container *ngIf="waitingRoomManagementService.gameType !== 'equipe'">
            <h2>Joueurs:</h2>
            <ng-container *ngIf="waitingRoomManagementService.players.length > 0; else noPlayers">
                <ul>
                    <li class="player-item" *ngFor="let player of waitingRoomManagementService.players">
                        <app-avatar class="player-name" [isChat]="true" [uid]="player"></app-avatar>
                        <div class='icon-container'>
                            <i class='fa fa-ban' (click)="banPlayer(player)" *ngIf='isHost' matTooltip='bannir'></i>
                        </div>
                    </li>
                </ul>
            </ng-container>
            <ng-template #noPlayers>
                <p class="text-gray-500">Aucun joueur présent</p>
            </ng-template>
        </ng-container>

        <ng-container *ngIf="waitingRoomManagementService.gameType === 'equipe'">
            <h2>Équipes:</h2>
            <div *ngIf="waitingRoomManagementService.teamsForInterface.length > 0; else noTeams" class="teams-container">
                <div *ngFor="let team of waitingRoomManagementService.teamsForInterface" class="team">
                    <div class="team-header">
                        <span>Équipe {{ team.name }}</span>
                        <button *ngIf="!isHost && !team.userIds.members.includes(currentUserId)"
                                class="action-btn"
                                (click)="waitingRoomManagementService.joinTeam(team.name)">Join
                        </button>
                    </div>
                    <div class="team-players">
                        <div *ngFor="let player of team.userIds.members" class="team-item">
                            <app-avatar class="team-avatar" [isChat]="true" [uid]="player"></app-avatar>
                            <div class='icon-container'>
                                <i class='fa fa-ban' (click)="banPlayer(player)" *ngIf='isHost' matTooltip='bannir'></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <ng-template #noTeams>
                <p class="text-gray-500">Aucun équipe présente</p>
            </ng-template>
        </ng-container>
    </div>

    <div class="actions">
        <button *ngIf='isHost' class="action-btn" (click)='startGame()'
                [disabled]="validationBeforeEntry()">
            Commencer
        </button>
        <button *ngIf="!isHost && waitingRoomManagementService.gameType === 'equipe'"
                [disabled]="onlyOneMember()"
                class="action-btn"
                (click)="waitingRoomManagementService.sendCreateTeam()">Créer Équipe
        </button>
        <app-leave-boutton></app-leave-boutton>
    </div>
</div>

<div *ngIf='waitingRoomManagementService.isTransition' class='transition'>
    <div class='timer'>
        <h2>Quiz commence dans :</h2>
        <div>{{ waitingRoomManagementService.time }}</div>
    </div>
    <app-leave-boutton></app-leave-boutton>
</div>
