<div class="stats-container">
    <h2 class="text-primary">Question {{index + 1}}</h2>
    <p class="text-primary">{{question?.text}}</p>
    <div class="graph-title">
        <button *ngIf="!isFirst()" class="arrow" (click)="previous()">{{ 'GAME_INTERFACE.HISTOGRAM.PREVIOUS' | translate }}</button>
        <button *ngIf="!isEnd()" class="arrow" (click)="next()">{{ 'GAME_INTERFACE.HISTOGRAM.NEXT' | translate }}</button>
    </div>
    <app-statistic-histogram
            [changingResponses]="responseNumber"
            [valueOfResponses]="responseValue"
            [isGameOver]='true'>
    </app-statistic-histogram>
</div>
