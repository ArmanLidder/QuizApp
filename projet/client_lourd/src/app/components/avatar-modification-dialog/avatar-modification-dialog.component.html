<div class="p-6 max-w-md mx-auto bg-white rounded-xl shadow-md space-y-6">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-4">Modification d'avatar</h2>

    <app-avatar-picker (avatarSelected)="onAvatarSelected($event)" class="mb-6"></app-avatar-picker>

    <div class="flex flex-col items-center space-y-4">
        <!-- Spinner -->
        <mat-spinner *ngIf="isUploading" [diameter]="40" [strokeWidth]="5" class="text-indigo-500 mx-auto block"></mat-spinner>

        <div class="flex justify-end space-x-4 w-full">
            <!-- Cancel Button -->
            <button (click)="cancel()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                Annuler
            </button>

            <!-- Confirm Button -->
            <button
                    [disabled]="!selectedAvatar || isUploading"
                    (click)="confirm()"
                    class="px-4 py-2 border border-transparent rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Confirmer
            </button>
        </div>
    </div>
</div>
