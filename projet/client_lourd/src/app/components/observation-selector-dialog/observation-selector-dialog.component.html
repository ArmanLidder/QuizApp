<div class="dialog-container bg-bgPrimary">
    <h2 class="dialog-title">{{ 'OBSERVER.CHOOSE_PLAYER' | translate }}</h2>
    <div class="players-list">
        <ul>
            <ng-container *ngFor="let player of observationService.playersList">
                <li class="player-item" *ngIf="playerObserved !== player">
                    <app-avatar class="player-name" [size]="'small'" [isChat]="true" [uid]="player"></app-avatar>
                    <button class="btn btn-primary" (click)="observe(player)">{{ 'OBSERVER.OBSERVE' | translate }}</button>
                </li>
            </ng-container>
        </ul>
    </div>
    <div class="actions">
        <button class="btn btn-cancel" type="button" (click)="closeDialog()">{{ 'OBSERVER.CANCEL' | translate }}</button>
    </div>
</div>
