 <div class="p-6 max-w-md mx-auto bg-bgPrimary shadow-md space-y-6">
    <h2 class="text-2xl font-bold text-center text-primary mb-4">{{ 'USERNAME_MODIFICATION.TITLE' | translate }}</h2>

    <!-- Form element to enable Enter key submission -->
    <form (ngSubmit)="confirm()" class="space-y-4">
        <label for="username" class="block text-sm font-medium text-primary">{{ 'USERNAME_MODIFICATION.NEW_USERNAME' | translate }}</label>
        <input
                [(ngModel)]="newUsername"
                name="username"
                type="text"
                id="username"
                maxlength="10"
                class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm"
                [placeholder]="'USERNAME_MODIFICATION.PLACEHOLDER' | translate"
        />

        <div class="flex flex-col items-center space-y-4">
            <div class="flex justify-end space-x-4 w-full">
                <button type="button" (click)="cancel()" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 transition duration-150 ease-in-out">
                    {{ 'USERNAME_MODIFICATION.CANCEL' | translate }}
                </button>

                <!-- Set as primary submit button for form submission -->
                <button
                        type="submit"
                        [disabled]="!newUsername"
                        class="px-4 py-2 border border-transparent rounded-md shadow-sm text-secondary bg-bgButton hover:opacity-75 focus:outline-none focus:ring-2 focus:ring-offset-2 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    {{ 'USERNAME_MODIFICATION.CONFIRM' | translate }}
                </button>
            </div>
        </div>
    </form>
</div>
