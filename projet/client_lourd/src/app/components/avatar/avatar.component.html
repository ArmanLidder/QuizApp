<p *ngIf="!isChat">{{this.profileService.userData?.username}}<p>
<div class="avatar-container">
    <img [src]="this.profileService.avatarUrl" alt="User Avatar" class="avatar-item" (click)="toggleMenu()" />
    <div *ngIf="menuEnabled && !isChat" class="dropdown-menu">
        <ul>
            <li (click)="goToProfile()">Voir Profile</li>
            <li (click)="logout()">Déconnexion</li>
        </ul>
    </div>
</div>
<p *ngIf="isChat">{{this.profileService.userData?.username}}<p>
