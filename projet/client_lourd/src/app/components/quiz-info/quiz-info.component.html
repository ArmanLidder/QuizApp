<div class="p-6 bg-white rounded-lg shadow-md space-y-4 max-w-full" *ngIf="selectedQuiz">
  <h3 class="text-xl font-semibold text-gray-900 truncate">{{ selectedQuiz.title }}</h3>
  <p class="text-gray-700"><span class="font-medium">Description:</span> <span class="break-words">{{ selectedQuiz.description }}</span></p>
  <p class="text-gray-700"><span class="font-medium">Durée:</span> {{ selectedQuiz.duration }} s</p>

  <h4 class="text-lg font-semibold text-gray-800 mt-4">Questions:</h4>
  <ul class="list-disc list-inside space-y-2">
    <li class="text-gray-700 break-words" *ngFor="let question of selectedQuiz.questions">
      {{ question.text }}
    </li>
  </ul>
</div>
