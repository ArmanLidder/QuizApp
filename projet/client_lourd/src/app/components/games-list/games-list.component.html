<div class="quizzes-container">
    <table class="table-auto w-full">
        <thead>
        <tr>
            <th class="w-1/2 px-4 py-2 text-left">Jeux</th>
            <th *ngIf="isAdmin" class="w-1/4 px-4 py-2 text-left">Dernière Modification</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngIf="quizzes.length === 0">
            <td colspan="3" class="text-center text-gray-500 py-4">
                Aucun jeu-questionnaire disponible pour le moment.
            </td>
        </tr>
        <tr *ngFor="let quiz of quizzes" [class.selected]="!isAdmin && quiz === selectedQuiz" (click)="selectQuiz(quiz)">
            <td [class.hover]="!isAdmin" class="px-4 py-3">
                <app-game-item [quiz]="quiz" class="game-item" [isAdmin]="isAdmin" (removeQuiz)="removeQuiz($event)" (refresh)="refresh($event)"></app-game-item>
                <app-quiz-info *ngIf="quiz === selectedQuiz && !isAdmin" [selectedQuiz]="quiz"></app-quiz-info>
            </td>
            <td *ngIf="isAdmin" class="text-gray-600 px-4 py-3">{{ quiz.lastModification }}</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="3">
                <div *ngIf="isAdmin" class="button-container flex justify-between space-x-4 pt-4">
                    <!-- Refresh Button on the Far Left -->
                    <button (click)="populateGameList()"
                            class="px-4 py-2 border border-gray-500 rounded bg-gray-500 text-white hover:bg-gray-600 transition">
                        <i class="fas fa-sync mr-2"></i> Rafraîchir
                    </button>

                    <!-- Other Buttons on the Far Right -->
                    <div class="flex space-x-4">
                        <button routerLink="/quiz-creation"
                                class="px-4 py-2 border border-blue-500 rounded bg-blue-500 text-white hover:bg-blue-600 transition">
                            <i class="fas fa-plus mr-2"></i> Ajouter
                        </button>
                        <input type="file" class="file-selector hidden" #fileInput accept="application/json" (change)="selectFile($event)" />
                        <button (click)="uploadFile()"
                                class="px-4 py-2 border border-green-500 rounded bg-green-500 text-white hover:bg-green-600 transition">
                            <i class="fas fa-file-import mr-2"></i> Importer
                        </button>
                    </div>
                </div>

                <div *ngIf="!isAdmin" class="button-container flex justify-end space-x-4 pt-4">
                    <button (click)="playGame()"
                            class="px-4 py-2 border border-blue-500 rounded bg-blue-500 text-white hover:bg-blue-600 transition"
                            [class.disabled-button]="!selectedQuiz"
                            [disabled]="!selectedQuiz">
                        Jouer
                    </button>
                    <button routerLink="/home"
                            class="px-4 py-2 border border-red-500 rounded bg-red-500 text-white hover:bg-red-600 transition">
                        Annuler
                    </button>
                </div>
            </td>
        </tr>
        </tfoot>

    </table>
</div>
