<div class="quizzes-container">
    <table class="table-auto w-full">
        <thead>
        <tr>
            <th class="w-1/2 px-4 py-2 text-left">{{ 'GAME_ADMIN.QUIZZES' | translate }}</th>
            <th *ngIf="isAdmin" class="w-1/4 px-4 py-2 text-left">{{ 'GAME_ADMIN.LAST_MODIFIED' | translate }}</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngIf="quizzes.length === 0">
            <td colspan="3" class="text-center text-gray-500 py-4">
                {{ 'GAME_ADMIN.NO_QUIZZES' | translate }}
            </td>
        </tr>
        <tr *ngFor="let quiz of quizzes" [class.selected]="!isAdmin && quiz === selectedQuiz" (click)="selectQuiz(quiz)">
            <td [class.hover]="!isAdmin" class="px-4 py-3">
                <app-game-item [quiz]="quiz" class="game-item" [isAdmin]="isAdmin" (removeQuiz)="removeQuiz($event)" (refresh)="refresh($event)"></app-game-item>
                <app-quiz-info *ngIf="quiz === selectedQuiz && !isAdmin" [selectedQuiz]="quiz"></app-quiz-info>
            </td>
            <td *ngIf="isAdmin" class="text-gray-600 px-4 py-3">{{ quiz.lastModification }}</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="3">
                <div class="flex justify-between space-x-4">
                    <button (click)="refresh()"
                            class="px-4 py-2 border border-gray-500 rounded bg-gray-500 text-white hover:bg-gray-600 transition">
                        <i class="fas fa-sync mr-2"></i> {{ 'GAME_ADMIN.REFRESH' | translate }}
                    </button>

                    <div class="flex space-x-4">
                        <ng-container *ngIf="isAdmin; else nonAdminButtons">
                            <button routerLink="/quiz-creation"
                                    class="px-4 py-2 border border-blue-500 rounded bg-blue-600 text-white hover:bg-blue-700 transition">
                                <i class="fas fa-plus mr-2"></i> {{ 'GAME_ADMIN.ADD' | translate }}
                            </button>
                            <input type="file" class="file-selector hidden" #fileInput accept="application/json" (change)="selectFile($event)" />
                            <button (click)="uploadFile()"
                                    class="px-4 py-2 border border-green-500 rounded bg-green-500 text-white hover:bg-green-600 transition">
                                <i class="fas fa-file-import mr-2"></i> {{ 'GAME_ADMIN.IMPORT' | translate }}
                            </button>
                        </ng-container>
                        <ng-template #nonAdminButtons>
                            <button [matTooltip]="!selectedQuiz ? ('GAME_ADMIN.PLAY_TOOLTIP' | translate) : ''" (click)="playGame()"
                                    class="px-4 py-2 border rounded transition"
                                    [ngClass]="{
          'border-blue-500 bg-blue-600 text-white hover:bg-blue-700': selectedQuiz,
          'border-gray-300 bg-gray-300 text-gray-500 cursor-not-allowed': !selectedQuiz
        }"
                                    [disabled]="!selectedQuiz">
                                {{ 'GAME_ADMIN.PLAY' | translate }}
                            </button>

                        </ng-template>
                    </div>
                </div>
            </td>
        </tr>
        </tfoot>
    </table>
</div>
