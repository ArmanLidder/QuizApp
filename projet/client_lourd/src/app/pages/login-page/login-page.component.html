<div class="h-screen flex items-center justify-center">
    <form [formGroup]="authForm" class="shadow-md rounded-md p-5 bg-white w-1/3" (ngSubmit)="login()">
        <div class="py-4">
            <h1 class="font-bold py-2">Connecter</h1>
            <h6 class="text-slate-600 text-base">Connectez-vous à votre compte</h6>
        </div>

        <mat-form-field appearance="fill" class="w-full">
            <mat-label>Nom d'utilisateur</mat-label>
            <mat-icon matPrefix>person</mat-icon>
            <input matInput placeholder="Saisissez votre nom d'utilisateur" formControlName="username" class="custom-input">
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full">
            <mat-label>Mot de passe</mat-label>
            <mat-icon matPrefix>lock</mat-icon>
            <input matInput type="password" placeholder="Entrez votre mot de passe" formControlName="password" class="custom-input" autocomplete="new-password">
        </mat-form-field>

        <button type="submit" class="w-full border border-slate-200 rounded-md disabled:bg-blue-300 py-2 px-3 bg-blue-700 text-white font-bold" [disabled]="!authForm.valid">
            Se Connecter
        </button>
        <div class="flex justify-center my-5">
  <span class="text-slate-600">
    Pas de compte?
  </span>
            <a class="text-purple-700 ml-2 font-bold" [routerLink]="['/register']">S'inscrire</a>
        </div>
    </form>
</div>


<style>
    .mat-form-field-flex {
        align-items: center;
    }

    .custom-input {
        padding: 12px 0;
    }

    .mat-icon {
        margin-top: 0;
    }
</style>
